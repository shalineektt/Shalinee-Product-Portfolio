<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuantumLeap ActionLoop prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300..900&display=swap">
<style>
:root{--bg:#050505;--bg2:#0C0C0E;--card:#141417;--card2:#1D1D21;--line:#2B2B30;--line2:#3A3A40;--text:#F4F4EE;--muted:#B8BA9B;--dim:#8E9078;--y:#F7C000;--green:#62C98A;--red:#FF7A6B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#050505;--bg2:#0C0C0E;--card:#141417;--card2:#1D1D21;--line:#2B2B30;--line2:#3A3A40;--text:#F4F4EE;--muted:#B8BA9B;--dim:#8E9078;--y:#F7C000;--green:#62C98A;--red:#FF7A6B}}
:root[data-theme="dark"]{--bg:#050505;--bg2:#0C0C0E;--card:#141417;--card2:#1D1D21;--line:#2B2B30;--line2:#3A3A40;--text:#F4F4EE;--muted:#B8BA9B;--dim:#8E9078;--y:#F7C000;--green:#62C98A;--red:#FF7A6B}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#050505}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Libre Franklin',Arial,sans-serif;font-size:16px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#050505;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:34px;object-fit:contain}
.brand b{font-size:18px;display:block;line-height:1.1}
.tag{font-size:12px;color:var(--y);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-selected="true"]{background:var(--y);color:#050505;font-weight:800}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#050505;font-size:12px;font-weight:800;margin-left:6px;text-align:center}
.tools{display:flex;gap:8px}
.ghost,.btn.ghost{background:transparent;color:var(--y);border:1px solid var(--y);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.banner{background:var(--bg2);border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;padding:8px 16px;text-align:center}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.wrap.noguide{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card + .card{margin-top:16px}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:26px;font-weight:800}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}
.muted{color:var(--muted)}
small,.sub{font-size:13px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;width:100%}
.stat .n{font-size:34px;font-weight:800;line-height:1.1;display:block}
.stat .l{font-size:14px;color:var(--muted)}
.stat.sel{border-color:var(--y)}
.green{color:var(--green)}.yellow{color:var(--y)}.red{color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.pill.track{color:var(--green);border-color:var(--green)}
.pill.attn{color:var(--y);border-color:var(--y)}
.pill.help{color:var(--red);border-color:var(--red)}
.pill.dim{color:var(--muted);border-color:var(--line2)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#18181c}
.btn{background:var(--y);color:#050505;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--y);background:transparent;color:var(--y);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.sel{background:var(--y);color:#050505;font-weight:800}
textarea,input[type=text],input[type=number],select{width:100%;background:#0C0C0E;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text)}
textarea{min-height:70px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--y)}
.callout{background:#1c1700;border:1px solid var(--y);border-radius:12px;padding:12px 14px}
.callout b{color:var(--y)}
.back{background:none;border:0;color:var(--y);cursor:pointer;padding:0;font-weight:700}
.phonewrap{max-width:430px;margin:0 auto}
.phone{border:2px solid var(--line2);border-radius:34px;background:#101013;display:flex;flex-direction:column;height:min(760px,calc(100vh - 235px));min-height:560px;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#0C0C0E}
.phead small{display:block}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--y);color:#050505;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.steps{display:flex;gap:6px;padding:0 0 10px;flex-wrap:wrap}
.step{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.step.cur{border-color:var(--y);color:var(--y);font-weight:700}
.step.done{color:var(--green);border-color:var(--green)}
.feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:94%}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--dim)}
.bubble{border-radius:16px;padding:12px 14px;font-size:15px}
.in .bubble{background:var(--card2);border-top-left-radius:4px}
.out .bubble{background:var(--y);color:#050505;border-top-right-radius:4px;font-weight:600}
.bubble p{margin:0 0 6px}
.reco{display:inline-block;background:#1c1700;border:1px solid var(--y);color:var(--y);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;margin-bottom:4px}
.acard{background:#101013;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;margin-top:8px}
.acard.col{flex-direction:column}
.arow{display:flex;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--y);color:#050505;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.atext{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.atext small{display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bform{margin-top:8px;padding:10px;border:1px dashed var(--y);border-radius:10px;display:flex;flex-direction:column;gap:8px}
.fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.ok{color:var(--green)}.warn{color:var(--y)}
.metric{background:#101013;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.big{font-size:26px;font-weight:800;color:var(--y)}
.srow{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.review{background:#0f1a13;border:1px solid var(--green);border-radius:10px;padding:10px;margin-top:8px}
.hint{text-align:center;color:var(--dim);font-size:13px;margin-top:10px}
.guide .step-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.guide .step-item:first-of-type{border-top:0}
.guide .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;color:var(--muted)}
.guide .mark.on{background:var(--green);border-color:var(--green);color:#050505}
.guide ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.event{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.event:first-child{border-top:0}
.who-chip{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--card2);color:var(--muted);flex:none;height:fit-content}
.who-chip.coach{background:#1c1700;color:var(--y)}
.who-chip.owner{background:#0f1a13;color:var(--green)}
.planrow{display:grid;grid-template-columns:1.6fr 1.2fr 110px 40px;gap:8px;align-items:end;margin-top:10px}
@media (max-width:760px){.planrow{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--y);color:#050505;font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.rules td,.rules th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.keep{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.keep input{width:auto}

/* highlighted owner updates on the coach screen */
.inbox{border:1px solid var(--y);background:#14110a;border-radius:16px;padding:16px;margin-bottom:16px}
.inbox-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--y);border-radius:12px;padding:12px 14px;margin-top:12px}
.inbox-card.help{border-left-color:var(--red)}
.newpill{display:inline-block;background:var(--y);color:#050505;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:8px;letter-spacing:.06em;vertical-align:middle}
.ievent{padding:8px 0;border-top:1px solid var(--line)}
.ievent:first-of-type{border-top:0}
.ievent small{display:block;margin-bottom:2px}
.q{border-radius:10px;padding:8px 10px;margin-top:2px;font-size:15px}
.q.help{background:#1c0f0d;border:1px solid var(--red)}
.q.result{background:#1c1700;border:1px solid var(--y)}
.card.fresh{border-color:var(--y);background:#14110a}
.tbl tr.fresh td{background:#18140a}
.tbl tr.fresh td:first-child{box-shadow:inset 4px 0 0 var(--y)}
.event.owner-ev{background:#14110a;border-left:4px solid var(--y);padding-left:12px}

/* WhatsApp theme: owner chat only. Everything else stays black and yellow. */
.phone{--y:#00A884;--card2:#202C33;--line:#2A3942;--line2:#2A3942;--text:#E9EDEF;--muted:#8696A0;--dim:#8696A0;--green:#25D366;--red:#F15C6D;background:#0B141A;border:2px solid #2A3942;color:#E9EDEF;font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.phone .phead{background:#202C33;border-bottom:0;color:#E9EDEF;padding:10px 14px}
.phone .phead small{color:#8696A0}
.phone .avatar{background:#0B141A;border:1px solid #2A3942;padding:4px;overflow:hidden}
.phone .avatar img{width:100%;height:100%;object-fit:contain}
.phone .feed{background-color:#0B141A;background-image:radial-gradient(#111B21 1.2px,transparent 1.2px);background-size:20px 20px;padding:12px 10px;gap:6px}
.phone .msg{max-width:90%}
.phone .bubble{font-size:15px;line-height:1.35;padding:8px 10px 6px;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.phone .in .bubble{background:#202C33;color:#E9EDEF;border-radius:0 8px 8px 8px}
.phone .out .bubble{background:#005C4B;color:#E9EDEF;font-weight:400;border-radius:8px 0 8px 8px}
.phone .ts{display:block;text-align:right;font-size:11px;color:#8696A0;margin-top:4px}
.phone .out .ts{color:#99BEB7}
.phone .tick{color:#53BDEB;margin-left:3px}
.phone .daychip{align-self:center;background:#182229;color:#8696A0;font-size:12px;padding:5px 12px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;margin:6px 0}
.phone .acard{background:#111B21;border:0;border-radius:8px}
.phone .num{background:#00A884;color:#111B21}
.phone .reco{background:#0B2A24;border-color:#00A884;color:#25D366}
.phone .chip{background:#111B21;border:0;color:#53BDEB;border-radius:8px;padding:8px 14px;font-weight:600}
.phone .chip.sel{background:#00A884;color:#111B21}
.phone .btn{background:#00A884;color:#111B21;border-radius:8px}
.phone .ghost{background:#111B21;border:0;color:#53BDEB;border-radius:8px}
.phone .bform{border:1px dashed #00A884}
.phone textarea,.phone input[type=text],.phone input[type=number]{background:#2A3942;border:0;color:#E9EDEF}
.phone .metric{background:#111B21;border:0}
.phone .big{color:#25D366}
.phone .srow{border-top:1px solid #2A3942}
.phone .review{background:#0B2A24;border:1px solid #00A884}
.phone .pill.track{color:#25D366;border-color:#25D366}
.phone .pill.attn{color:#FFD279;border-color:#FFD279}
.phone .pill.help{color:#F15C6D;border-color:#F15C6D}
.phone .pill.dim{color:#8696A0;border-color:#2A3942}
.phone .ok{color:#25D366}
.phone .warn{color:#FFD279}
.phone .inputbar{background:#202C33;padding:10px 12px;display:flex;align-items:center}
.phone .inputbar .fake{flex:1;background:#2A3942;border-radius:20px;padding:8px 14px;color:#8696A0;font-size:14px}
</style>
</head>
<body>
<div id="top"></div>
<div class="banner">Prototype with sample data. It simulates WhatsApp and is not connected to WhatsApp or any QuantumLeap system. Everything stays in this browser.</div>
<main class="wrap" id="wrap">
<section id="stage" aria-live="polite"></section>
<aside id="guide" class="guide"></aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>

var state=load();
var ui={role:'owner',coachTab:'dashboard',filter:'all',openBiz:null,bizTab:'plan',guide:true,drafts:{},blocker:null,smaller:false,keep:{},revise:null,review:{},plan:null,fresh:null,resetArmed:false};
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===2&&o.biz)return o;}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function B(id){return state.biz.filter(function(b){return b.id===id;})[0];}
function nextSeq(){state.seq+=1;return state.seq;}
function addEvent(b,who,kind,text,x){var e={seq:nextSeq(),who:who,kind:kind,text:text,day:DAY[b.stage],seen:who!=='owner'};if(x)Object.keys(x).forEach(function(k){e[k]=x[k];});b.events.push(e);return e;}
function unseen(b){return b.events.filter(function(e){return e.who==='owner'&&!e.seen;});}
function unseenTotal(){var n=0;state.biz.forEach(function(b){n+=unseen(b).length;});return n;}
var uidN=0;function uid(){uidN+=1;return 'x'+Date.now().toString(36)+uidN;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return document.querySelector(s);}

/* ---------- rules ---------- */
function counts(b){var a=b.actions;function n(f){return a.filter(f).length;}return {total:a.length,done:n(function(x){return x.status==='done';}),partly:n(function(x){return x.status==='partly';}),help:n(function(x){return x.status==='help';}),pending:n(function(x){return x.status==='pending';}),withResult:n(function(x){return !!x.result;})};}
function openBlockers(b){return b.actions.filter(function(a){return a.blocker&&!a.blocker.resolved;});}
function evaluate(b){
 var c=counts(b),ob=openBlockers(b);
 if(ob.length) return {status:'help',rank:0,reason:'Blocker open: '+ob[0].blocker.reason,next:'Discuss the blocker'};
 if(b.stage==='plan') return {status:'track',rank:4,reason:'Plan sent, waiting for the owner to confirm',next:'Wait for the owner to confirm'};
 if(b.stage==='progress'){
  if(b.daysQuiet>=2) return {status:'attn',rank:1,reason:'No update for '+b.daysQuiet+' days',next:'Contact the owner'};
  if(c.done+c.partly+c.help===0) return {status:'attn',rank:1,reason:'No update yet',next:'Send a reminder'};
  if(c.done/c.total<0.5) return {status:'attn',rank:2,reason:'Behind: '+c.done+' of '+c.total+' done',next:'Review what is preventing progress'};
  return {status:'track',rank:3,reason:'On track: '+c.done+' of '+c.total+' done',next:'No action needed'};
 }
 if(b.stage==='result'){
  var miss=c.total-c.withResult;
  if(miss>0) return {status:'attn',rank:2,reason:'Result missing for '+miss+' action'+(miss>1?'s':''),next:'Remind the owner to record results'};
  return {status:'track',rank:3,reason:'Results recorded',next:'Review results'};
 }
 var missed=b.actions.filter(function(a){return a.status!=='done';}).length;
 if(missed>0) return {status:'attn',rank:2,reason:'Missed actions: '+missed,next:'Understand why before changing the plan'};
 return {status:'track',rank:3,reason:b.review?'Reviewed with the owner':'All actions completed',next:b.review?'Plan next week':'Review results and agree on next steps'};
}
function progressText(b){var c=counts(b);if(b.stage==='plan')return 'Plan sent';if(b.stage==='progress'&&c.done+c.partly+c.help===0)return 'No update';return c.done+' of '+c.total+' done';}
function metric(){var t=0,o=0;state.biz.forEach(function(b){t+=b.actions.length;b.actions.forEach(function(a){if(a.status==='done'&&a.result)o++;});});return {total:t,ok:o,pct:t?Math.round(o/t*100):0};}
function pillFor(st){return st==='help'?'help':st==='attn'?'attn':'track';}
function statusName(st){return st==='help'?'Needs help':st==='attn'?'Needs attention':'On track';}
function aLabel(a){return a.status==='done'?'Done':a.status==='partly'?'Partly done':a.status==='help'?'Need help':'Not done';}
function aPill(a){return a.status==='done'?'track':a.status==='help'?'help':a.status==='partly'?'attn':'dim';}
function resultText(a){if(!a.result)return 'No result recorded yet';return a.fields.map(function(f,k){var v=a.result.values[k];return esc(f.label)+': '+(v===''||v==null?'–':esc(v));}).join(' · ');}

/* ---------- owner feed ---------- */
function dayOf(w){var p=String(w).split(' · ');return p[p.length-1];}
function inBubble(inner,who){var d=dayOf(who);return '<div class="msg in" data-day="'+esc(d)+'"><div class="bubble">'+inner+'<span class="ts">'+esc(d)+'</span></div></div>';}
function outBubble(inner,day){return '<div class="msg out" data-day="'+esc(day)+'"><div class="bubble">'+inner+'<span class="ts">'+esc(day)+'<span class="tick">✓✓</span></span></div></div>';}
function chipBtn(act,label,val,a,sel){return '<button class="chip'+(sel?' sel':'')+'" data-act="'+act+'" data-a="'+a.id+'" data-v="'+val+'" aria-pressed="'+(sel?'true':'false')+'">'+label+'</button>';}

 });

   if(openForm){
    h+='<div class="bform"><b>What’s getting in the way?</b><div class="chips">'+REASONS.map(function(r){return '<button class="chip'+(ui.blocker.reason===r?' sel':'')+'" data-act="reason" data-v="'+esc(r)+'">'+esc(r)+'</button>';}).join('')+'</div><textarea data-draft="note:'+a.id+'" placeholder="Add a note for your coach (optional)">'+esc(ui.drafts['note:'+a.id]||'')+'</textarea><div class="btns"><button class="btn small" data-act="send-blocker"'+(ui.blocker.reason?'':' disabled')+'>Ask my coach for help</button><button class="ghost" data-act="cancel-blocker">Cancel</button></div></div>';

  }

 });
 if(live){

function resultBubble(b){
 var live=b.stage==='result';
 var h='<p>'+(live?'Friday: tell me what happened this week.':'Friday results')+'</p>'+(live?'<small>A completed action needs a result. The result does not have to be good, only honest.</small>':'');
 b.actions.forEach(function(a,i){

   }).join('')+'</div>';
  } else {
   h+='<div class="chips"><span class="pill '+aPill(a)+'">'+aLabel(a)+'</span></div><small>'+resultText(a)+'</small>';
  }
  h+='</div>';
 });
 if(live) h+='<div class="btns"><button class="btn" data-act="send-results">Send my results</button></div>';
 return inBubble(h,'Your coach · Fri');
}
function summaryBubble(b){
 var total=b.actions.length,ok=b.actions.filter(function(a){return a.status==='done'&&a.result;}).length;
 var h='<p><b>Your week at a glance</b></p><div class="metric"><span class="big">'+ok+' of '+total+'</span> actions completed with a result</div>';
 b.actions.forEach(function(a){h+='<div class="srow"><span><span class="pill '+aPill(a)+'">'+aLabel(a)+'</span> '+esc(a.text)+'</span><small>'+resultText(a)+'</small></div>';});
 var ob=openBlockers(b);
 if(ob.length) h+='<small class="warn">Still open with your coach: '+esc(ob[0].blocker.reason)+'.</small>';
 if(b.review){
  h+='<div class="review"><b>Review with your coach</b>'+b.actions.map(function(a){var d=b.review.decisions[a.id];return '<div><small>'+esc(a.text)+': <b>'+(d==='continue'?'Continue':d==='change'?'Change':'Drop')+'</b></small></div>';}).join('')+(b.review.note?'<p style="margin:6px 0 0">“'+esc(b.review.note)+'”</p>':'')+'</div>';
 } else h+='<small>Your coach will review these results with you and agree next week’s plan.</small>';
 return inBubble(h,'Your coach · Fri');
}
function ownerFeed(b){
 var it=[];
 it.push({seq:b.seqs.plan,html:planBubble(b)});
 if(b.confirmed) it.push({seq:b.seqs.confirmed,html:outBubble(b.reduced?'Plan confirmed with '+b.actions.length+' action'+(b.actions.length>1?'s':'')+' ✓':'Plan confirmed ✓','Mon')});
 if(STAGES[b.stage]>=1) it.push({seq:b.seqs.progress,html:checkinBubble(b)});
 b.actions.forEach(function(a){if(a.blocker)it.push({seq:a.blocker.seq,html:outBubble('Need help with “'+esc(a.text)+'”: '+esc(a.blocker.reason)+(a.blocker.note?'<br><small style="color:#B8D8D0">'+esc(a.blocker.note)+'</small>':''),'Wed')});});
 b.messages.forEach(function(m){it.push({seq:m.seq,html:inBubble('<p style="margin:0">'+esc(m.text)+'</p>','Your coach · '+m.day)});});
 if(STAGES[b.stage]>=2) it.push({seq:b.seqs.result,html:resultBubble(b)});
 if(b.stage==='done'){it.push({seq:b.seqs.done,html:outBubble('Results sent ✓','Fri')});it.push({seq:b.seqs.done+0.1,html:summaryBubble(b)});}
 it.sort(function(x,y){return x.seq-y.seq;});
 var out='',last='',names={Mon:'Monday',Wed:'Wednesday',Fri:'Friday'};
 it.forEach(function(i){var m=/data-day="([^"]*)"/.exec(i.html),dd=m?m[1]:'';if(dd&&dd!==last){out+='<div class="daychip">'+(names[dd]||dd)+'</div>';last=dd;}out+=i.html;});
 return out;
}

function renderCoach(){

function renderInbox(){

 function hasHelp(g){return g.ev.some(function(e){return e.sev==='help';});}
 groups.sort(function(x,y){return (hasHelp(x)?0:1)-(hasHelp(y)?0:1)||y.ev[y.ev.length-1].seq-x.ev[x.ev.length-1].seq;});
 var total=unseenTotal();
 var h='<div class="inbox"><div class="row spread"><div><span class="eyebrow">New from owners</span><h3>'+total+' new update'+(total>1?'s':'')+' from the WhatsApp chat</h3></div><button class="ghost" data-act="seen-all">Mark all as seen</button></div>';
 groups.forEach(function(g){

 });
 return h+'</div>';

  addEvent(b,'coach','revise','Revised an action: “'+old+'” → “'+t+'”.');ui.revise=null;toast('Action revised');commit();
 },
 'review-choice':function(d){ui.review[d.a]=d.v;render();},
 'save-review':function(d){
  var b=B(d.b);
  if(b.actions.some(function(a){return !ui.review[a.id];})){toast('Choose Continue, Change or Drop for each action');return;}
  var dec={};b.actions.forEach(function(a){dec[a.id]=ui.review[a.id];});
  b.review={decisions:dec,note:String(ui.drafts['review:note']||'').trim()};
  b.messages.push({seq:nextSeq(),text:'I’ve reviewed your week with you. The decisions are in your summary.',day:DAY[b.stage],from:'coach'});
  addEvent(b,'coach','review','Reviewed the week and agreed what to continue, change or drop.');ui.review={};delete ui.drafts['review:note'];toast('Review shared');commit();
 },
 'plan-reco':function(d){ensurePlan();ui.plan.reco=d.v;ui.plan.rows=TEMPLATES[d.v].map(function(t){return {text:t.text,measure:t.measure,fields:t.fields,deadline:'Friday'};});render();},
 'plan-add':function(){ensurePlan();if(ui.plan.rows.length<3){ui.plan.rows.push({text:'',measure:'',fields:null,deadline:'Friday'});render();}},
 'plan-remove':function(d){ensurePlan();ui.plan.rows.splice(+d.i,1);render();},
 'plan-send':function(){
  ensurePlan();var p=ui.plan,b=B(p.biz);
  if(!p.rows.length){toast('Add at least one action');return;}
  for(var i=0;i<p.rows.length;i++){if(!p.rows[i].text.trim()||!p.rows[i].measure.trim()){toast('Each action needs a description and a measure');return;}}
  b.recommendation=p.reco;b.stage='plan';b.confirmed=false;b.reduced=false;b.daysQuiet=0;b.review=null;b.messages=[];
  b.actions=p.rows.map(function(r){return {id:uid(),text:r.text.trim(),measure:r.measure.trim(),deadline:r.deadline,fields:r.fields||[{label:r.measure.trim(),type:'number'}],status:'pending',result:null,blocker:null};});
  var q=nextSeq();b.seqs={plan:q,confirmed:q+0.01,progress:q+0.02,result:q+0.03,done:q+0.04};
  addEvent(b,'coach','plan','Sent a new weekly plan: '+b.actions.length+' action'+(b.actions.length>1?'s':'')+' for “'+p.reco+'”.');
  ui.plan=null;ui.smaller=false;ui.blocker=null;ui.review={};toast('Plan sent to '+b.owner);ui.coachTab='dashboard';commit({top:true});
 },
 'guide-go':function(d){
  if(d.v==='owner'){ui.role='owner';render({top:true,bottom:true});}
  else if(d.v==='coach'){ui.role='coach';ui.openBiz=null;ui.coachTab='dashboard';render({top:true});}
  else{ui.role='coach';openBusiness('E','support');}
 }
};
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var f=H[t.getAttribute('data-act')];if(f){f(t.dataset,t);}
});
function onField(e){
 var t=e.target;
 if(t.hasAttribute('data-draft')){ui.drafts[t.getAttribute('data-draft')]=t.value;}
 else if(t.hasAttribute('data-keep')){ui.keep[t.getAttribute('data-keep')]=t.checked;}
 else if(t.hasAttribute('data-planrow')&&ui.plan){ui.plan.rows[+t.getAttribute('data-planrow')][t.getAttribute('data-pf')]=t.value;}
 else if(t.hasAttribute('data-planbiz')&&ui.plan){ui.plan.biz=t.value;}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
window.addEventListener('storage',function(e){if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);render();}catch(x){}}});
window.__ql={get state(){return state;},get ui(){return ui;},H:H,evaluate:evaluate,metric:metric};
render();
})();
</script>
</body>
